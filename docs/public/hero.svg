<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-label="Ilustrasi naga dan gapura Tionghoa">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9EC"/>
      <stop offset="1" stop-color="#F6EACB"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC53D"/>
      <stop offset="1" stop-color="#efa51f"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC53D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFC53D" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7a4d00" flood-opacity="0.25"/>
    </filter>
    <style>
      .fade1 { animation: fadeIn 1s ease both; }
      .fade2 { animation: fadeIn 1s .35s ease both; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      .sway { animation: sway 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
      .sway2 { animation: sway 5.1s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: 50% 0%; }
      @keyframes sway { 0%,100% { transform: rotate(-2.6deg); } 50% { transform: rotate(2.6deg); } }
      .drift { animation: drift 9s ease-in-out infinite; }
      .drift2 { animation: drift 11s ease-in-out infinite reverse; }
      @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
      .dragon-float { animation: dragonFloat 6s ease-in-out infinite; }
      @keyframes dragonFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .sun-pulse { animation: sunPulse 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes sunPulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.12); opacity: 1; } }
      .whisker { animation: whisker 3s ease-in-out infinite; }
      @keyframes whisker { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    </style>
  </defs>

  <!-- langit -->
  <rect width="560" height="480" fill="url(#skyGrad)"/>

  <!-- matahari -->
  <circle cx="472" cy="78" r="62" fill="url(#sunGlow)" class="sun-pulse"/>
  <circle cx="472" cy="78" r="36" fill="url(#goldGrad)"/>

  <!-- awan -->
  <g fill="#ffffff" opacity="0.9">
    <g class="drift">
      <ellipse cx="86" cy="208" rx="30" ry="17"/><ellipse cx="112" cy="200" rx="34" ry="20"/><ellipse cx="138" cy="208" rx="26" ry="15"/>
    </g>
    <g class="drift2">
      <ellipse cx="442" cy="228" rx="28" ry="16"/><ellipse cx="466" cy="220" rx="32" ry="19"/><ellipse cx="490" cy="228" rx="24" ry="14"/>
    </g>
  </g>

  <!-- NAGA -->
  <g class="dragon-float fade1">
    <path d="M28,132 C110,52 190,152 290,96 C390,44 470,102 536,56" fill="none" stroke="#C8102E" stroke-width="30" stroke-linecap="round"/>
    <path d="M28,132 C110,52 190,152 290,96 C390,44 470,102 536,56" fill="none" stroke="#f2667c" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
    <path d="M28,132 C110,52 190,152 290,96 C390,44 470,102 536,56" fill="none" stroke="#FFC53D" stroke-width="30" stroke-linecap="round" stroke-dasharray="2 34" opacity="0.9"/>
    <!-- ekor -->
    <path d="M28,132 q-20,2 -30,18 q16,2 30,-4 q-14,10 -16,24 q18,-8 28,-22 Z" fill="#C8102E"/>
    <!-- surai -->
    <path d="M508,52 q-16,-14 -14,-34 q12,10 20,12 q-6,-14 -2,-28 q10,14 12,30 q8,-8 18,-10 q-6,12 -8,24 Z" fill="url(#goldGrad)"/>
    <!-- kepala -->
    <g>
      <ellipse cx="534" cy="60" rx="25" ry="19" fill="#C8102E" transform="rotate(-18 534 60)"/>
      <ellipse cx="554" cy="52" rx="12" ry="9" fill="#d31a35" transform="rotate(-18 554 52)"/>
      <circle cx="538" cy="50" r="7.5" fill="#fff"/>
      <circle cx="540" cy="50" r="3.6" fill="#161616"/>
      <circle cx="541.5" cy="48.5" r="1.2" fill="#fff"/>
      <!-- tanduk -->
      <path d="M520,44 C510,30 498,24 486,22" fill="none" stroke="#FFC53D" stroke-width="5" stroke-linecap="round"/>
      <path d="M528,38 C522,24 514,16 504,12" fill="none" stroke="#FFC53D" stroke-width="4" stroke-linecap="round"/>
      <!-- kumis -->
      <g class="whisker">
        <path d="M562,56 C582,60 598,72 606,90" fill="none" stroke="#FFC53D" stroke-width="3" stroke-linecap="round"/>
        <path d="M560,64 C576,72 588,86 592,104" fill="none" stroke="#FFC53D" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- GAPURA -->
  <g class="fade2">
    <!-- tangga -->
    <rect x="150" y="412" width="260" height="14" rx="4" fill="#dcc9a3"/>
    <rect x="172" y="426" width="216" height="14" rx="4" fill="#e8d9b8"/>
    <!-- pilar -->
    <rect x="168" y="244" width="30" height="168" fill="#9c1428"/>
    <rect x="362" y="244" width="30" height="168" fill="#9c1428"/>
    <rect x="168" y="282" width="30" height="9" fill="#d4a017"/>
    <rect x="362" y="282" width="30" height="9" fill="#d4a017"/>
    <rect x="168" y="362" width="30" height="9" fill="#d4a017"/>
    <rect x="362" y="362" width="30" height="9" fill="#d4a017"/>
    <!-- balok -->
    <rect x="150" y="230" width="260" height="17" rx="4" fill="#7d0f20"/>
    <!-- atap -->
    <path d="M100,252 C160,196 220,182 280,182 C340,182 400,196 460,252 L428,252 C380,214 330,204 280,204 C230,204 180,214 132,252 Z" fill="#33404f"/>
    <path d="M100,252 q-24,0 -36,-24 q22,8 40,12 Z" fill="#33404f"/>
    <path d="M460,252 q24,0 36,-24 q-22,8 -40,12 Z" fill="#33404f"/>
    <path d="M132,252 C180,214 230,204 280,204 C330,204 380,214 428,252" fill="none" stroke="#FFC53D" stroke-width="3"/>
    <rect x="258" y="156" width="44" height="28" rx="6" fill="#33404f"/>
    <rect x="276" y="142" width="8" height="18" fill="#d4a017"/>
    <circle cx="280" cy="138" r="9" fill="url(#goldGrad)"/>
    <!-- papan nama -->
    <line x1="242" y1="247" x2="242" y2="268" stroke="#5a3a22" stroke-width="4"/>
    <line x1="318" y1="247" x2="318" y2="268" stroke="#5a3a22" stroke-width="4"/>
    <rect x="218" y="268" width="124" height="66" rx="8" fill="#2e1c11" stroke="#d4a017" stroke-width="3"/>
    <text x="280" y="316" text-anchor="middle" font-size="42" font-weight="900" fill="#FFC53D" font-family="'Noto Serif SC','Songti SC',serif">学</text>
  </g>

  <!-- LAMPION -->
  <g class="sway">
    <line x1="120" y1="248" x2="120" y2="284" stroke="#5a3a22" stroke-width="3"/>
    <circle cx="120" cy="316" r="44" fill="#C8102E" opacity="0.12"/>
    <rect x="107" y="284" width="26" height="9" rx="3" fill="#8a6d1f"/>
    <ellipse cx="120" cy="316" rx="30" ry="32" fill="#C8102E"/>
    <path d="M102,290 Q94,316 102,342 M138,290 Q146,316 138,342" fill="none" stroke="#8f0c20" stroke-width="2"/>
    <text x="120" y="327" text-anchor="middle" font-size="26" font-weight="700" fill="#FFC53D" font-family="'Noto Serif SC','Songti SC',serif">福</text>
    <rect x="109" y="346" width="22" height="8" rx="3" fill="#8a6d1f"/>
    <line x1="120" y1="354" x2="120" y2="374" stroke="#C8102E" stroke-width="3"/>
    <circle cx="120" cy="378" r="5" fill="#FFC53D"/>
  </g>
  <g class="sway2">
    <line x1="440" y1="248" x2="440" y2="284" stroke="#5a3a22" stroke-width="3"/>
    <circle cx="440" cy="316" r="44" fill="#C8102E" opacity="0.12"/>
    <rect x="427" y="284" width="26" height="9" rx="3" fill="#8a6d1f"/>
    <ellipse cx="440" cy="316" rx="30" ry="32" fill="#C8102E"/>
    <path d="M422,290 Q414,316 422,342 M458,290 Q466,316 458,342" fill="none" stroke="#8f0c20" stroke-width="2"/>
    <text x="440" y="327" text-anchor="middle" font-size="26" font-weight="700" fill="#FFC53D" font-family="'Noto Serif SC','Songti SC',serif">福</text>
    <rect x="429" y="346" width="22" height="8" rx="3" fill="#8a6d1f"/>
    <line x1="440" y1="354" x2="440" y2="374" stroke="#C8102E" stroke-width="3"/>
    <circle cx="440" cy="378" r="5" fill="#FFC53D"/>
  </g>

  <!-- ingot -->
  <g class="fade2" filter="url(#soft)">
    <path d="M58,448 Q58,434 70,434 L74,426 Q80,422 86,426 L90,434 Q102,434 102,448 Q102,458 80,458 Q58,458 58,448 Z" fill="url(#goldGrad)"/>
    <path d="M458,452 Q458,440 468,440 L472,433 Q477,430 482,433 L486,440 Q496,440 496,452 Q496,460 477,460 Q458,460 458,452 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
