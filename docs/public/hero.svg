<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-label="Ilustrasi atom hanzi">
  <defs>
    <linearGradient id="sealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d31a35"/>
      <stop offset="1" stop-color="#a00d26"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC53D"/>
      <stop offset="1" stop-color="#efa51f"/>
    </linearGradient>
    <radialGradient id="nucleusGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#C8102E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C8102E" flood-opacity="0.3"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#161616" flood-opacity="0.2"/>
    </filter>
    <style>
      .fade1 { animation: fadeIn 1s ease both; }
      .fade2 { animation: fadeIn 1s .3s ease both; }
      @keyframes fadeIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
      .nucleus-pulse { animation: nPulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes nPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    </style>
  </defs>

  <!-- latar -->
  <circle cx="280" cy="240" r="215" fill="#FAF3E0" opacity="0.7"/>
  <ellipse cx="470" cy="90" rx="80" ry="50" fill="#FFC53D" opacity="0.15"/>
  <ellipse cx="90" cy="410" rx="90" ry="45" fill="#C8102E" opacity="0.06"/>

  <!-- orbit (statis, elektronnya yang jalan) -->
  <g fill="none" stroke="#C8102E" stroke-width="1.6" opacity="0.35">
    <ellipse cx="280" cy="240" rx="195" ry="78"/>
    <ellipse cx="280" cy="240" rx="195" ry="78" transform="rotate(60 280 240)"/>
    <ellipse cx="280" cy="240" rx="195" ry="78" transform="rotate(120 280 240)"/>
  </g>

  <!-- inti atom -->
  <circle cx="280" cy="240" r="130" fill="url(#nucleusGlow)" class="fade1"/>
  <g class="fade1 nucleus-pulse" filter="url(#soft)">
    <rect x="205" y="165" width="150" height="150" rx="32" fill="url(#sealGrad)"/>
    <rect x="216" y="176" width="128" height="128" rx="24" fill="none" stroke="#FFC53D" stroke-width="2.5" opacity="0.9"/>
    <text x="280" y="278" text-anchor="middle" font-size="96" font-weight="900" fill="#ffffff" font-family="'Noto Serif SC','Songti SC',serif">学</text>
  </g>

  <!-- elektron orbit 1 -->
  <g>
    <animateMotion dur="9s" repeatCount="indefinite" path="M85,240 a195,78 0 1,0 390,0 a195,78 0 1,0 -390,0"/>
    <g filter="url(#soft2)"><circle r="22" fill="#fff" stroke="#C8102E" stroke-width="2.5"/><text y="9" text-anchor="middle" font-size="24" font-weight="700" fill="#C8102E" font-family="sans-serif">ˉ</text></g>
  </g>
  <g>
    <animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite" path="M85,240 a195,78 0 1,0 390,0 a195,78 0 1,0 -390,0"/>
    <g filter="url(#soft2)"><circle r="22" fill="#161616"/><text y="10" text-anchor="middle" font-size="24" font-weight="700" fill="#FFC53D" font-family="'Noto Serif SC','Songti SC',serif">子</text></g>
  </g>
  <!-- elektron orbit 2 (miring 60°) -->
  <g transform="rotate(60 280 240)">
    <g>
      <animateMotion dur="12s" repeatCount="indefinite" path="M85,240 a195,78 0 1,0 390,0 a195,78 0 1,0 -390,0"/>
      <g filter="url(#soft2)"><circle r="22" fill="#fff" stroke="#C8102E" stroke-width="2.5"/><text y="9" text-anchor="middle" font-size="24" font-weight="700" fill="#C8102E" font-family="sans-serif">ˊ</text></g>
    </g>
    <g>
      <animateMotion dur="12s" begin="-6s" repeatCount="indefinite" path="M85,240 a195,78 0 1,0 390,0 a195,78 0 1,0 -390,0"/>
      <g filter="url(#soft2)"><circle r="22" fill="#161616"/><text y="10" text-anchor="middle" font-size="24" font-weight="700" fill="#FFC53D" font-family="'Noto Serif SC','Songti SC',serif">冖</text></g>
    </g>
  </g>
  <!-- elektron orbit 3 (miring 120°) -->
  <g transform="rotate(120 280 240)">
    <g>
      <animateMotion dur="14s" repeatCount="indefinite" path="M85,240 a195,78 0 1,0 390,0 a195,78 0 1,0 -390,0"/>
      <g filter="url(#soft2)"><circle r="22" fill="#fff" stroke="#C8102E" stroke-width="2.5"/><text y="9" text-anchor="middle" font-size="24" font-weight="700" fill="#C8102E" font-family="sans-serif">ˇ</text></g>
    </g>
    <g>
      <animateMotion dur="14s" begin="-4.6s" repeatCount="indefinite" path="M85,240 a195,78 0 1,0 390,0 a195,78 0 1,0 -390,0"/>
      <g filter="url(#soft2)"><circle r="22" fill="#161616"/><text y="10" text-anchor="middle" font-size="24" font-weight="700" fill="#FFC53D" font-family="'Noto Serif SC','Songti SC',serif">⺍</text></g>
    </g>
    <g>
      <animateMotion dur="14s" begin="-9.3s" repeatCount="indefinite" path="M85,240 a195,78 0 1,0 390,0 a195,78 0 1,0 -390,0"/>
      <g filter="url(#soft2)"><circle r="22" fill="#fff" stroke="#C8102E" stroke-width="2.5"/><text y="9" text-anchor="middle" font-size="24" font-weight="700" fill="#C8102E" font-family="sans-serif">ˋ</text></g>
    </g>
  </g>

  <!-- pita -->
  <g class="fade2" filter="url(#soft2)">
    <rect x="228" y="322" width="104" height="34" rx="17" fill="url(#goldGrad)"/>
    <text x="280" y="345" text-anchor="middle" font-size="19" font-weight="700" fill="#7a4d00" font-family="sans-serif">xué · belajar</text>
  </g>

  <!-- badge -->
  <g class="fade2" font-family="sans-serif">
    <rect x="468" y="30" width="80" height="30" rx="15" fill="#C8102E"/>
    <text x="508" y="51" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">HSK 1–3</text>
  </g>
  <g class="fade2" font-family="sans-serif">
    <rect x="12" y="30" width="150" height="30" rx="15" fill="#161616"/>
    <text x="87" y="51" text-anchor="middle" font-size="14" font-weight="700" fill="#FFC53D">⺍ + 冖 + 子 = 学</text>
  </g>
</svg>
